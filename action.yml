name: 'a-factory'
description: 'Issue-driven autonomous SDLC: provisions an exe.dev VM running Shelley to work a GitHub issue and open a PR'

inputs:
  exe-api-token:
    description: 'exe.dev API bearer token (mint via: ssh exe.dev ssh-key generate-api-key), scoped to at least new/rm/ls'
    required: true
  exe-ssh-private-key:
    description: 'Account SSH private key (PEM) for exe.dev — required for operations exe.dev refuses over any bearer token regardless of scope: minting a per-VM Shelley key and GitHub-integration lookup/attach. See AGENTS.md.'
    required: true
  github-token:
    description: 'Token the Actions job uses to comment/label on issues and PRs (distinct from the in-VM agent''s own git/gh access, which goes through exe.dev''s GitHub integration)'
    required: false
    default: ${{ github.token }}
  vm-image:
    description: 'exe.dev VM image to provision (default: ghcr.io/rlweb/a-factory:latest)'
    required: false
    default: ''
  vm-prefix:
    description: 'VM name prefix — each box is named "<prefix>-issue-<n>" (default: a-factory)'
    required: false
    default: ''
  vm-cpu:
    description: 'exe.dev VM CPU count (default: exe.dev default)'
    required: false
    default: ''
  vm-memory:
    description: 'exe.dev VM memory allocation, for example 4GB (default: exe.dev default)'
    required: false
    default: ''
  vm-disk:
    description: 'exe.dev VM disk size, for example 50GB (default: exe.dev default)'
    required: false
    default: ''
  vm-tags:
    description: 'Additional comma-separated exe.dev VM tags (a-factory tag is always added)'
    required: false
    default: ''
  vm-env:
    description: 'Comma-separated KEY=VALUE environment variables passed to exe.dev new'
    required: false
    default: ''
  vm-pool:
    description: 'exe.dev team pool in which to create the VM'
    required: false
    default: ''
  vm-integrations:
    description: 'Additional comma-separated exe.dev integrations to attach at creation'
    required: false
    default: ''
  vm-registry-auth:
    description: 'USERNAME:PASSWORD for a private registry hosting vm-image; pass from a secret'
    required: false
    default: ''
  vm-setup-script:
    description: 'exe.dev first-boot setup script, max 10KiB; use a block scalar for multiline YAML'
    required: false
    default: ''
  cheap-model:
    description: 'Model for type:ticket / type:bug (default: deepseek-v4-flash)'
    required: false
    default: ''
  strong-model:
    description: 'Model for type:epic (default: deepseek-v4-pro)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Build a-factory
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o ${{ runner.temp }}/a-factory ./cmd/a-factory

    - name: Run a-factory
      shell: bash
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        EXE_API_TOKEN: ${{ inputs.exe-api-token }}
        EXE_SSH_PRIVATE_KEY: ${{ inputs.exe-ssh-private-key }}
        FACTORY_BOX_IMAGE: ${{ inputs.vm-image }}
        FACTORY_VM_PREFIX: ${{ inputs.vm-prefix }}
        FACTORY_VM_CPU: ${{ inputs.vm-cpu }}
        FACTORY_VM_MEMORY: ${{ inputs.vm-memory }}
        FACTORY_VM_DISK: ${{ inputs.vm-disk }}
        FACTORY_VM_TAGS: ${{ inputs.vm-tags }}
        FACTORY_VM_ENV: ${{ inputs.vm-env }}
        FACTORY_VM_POOL: ${{ inputs.vm-pool }}
        FACTORY_VM_INTEGRATIONS: ${{ inputs.vm-integrations }}
        FACTORY_VM_REGISTRY_AUTH: ${{ inputs.vm-registry-auth }}
        FACTORY_VM_SETUP_SCRIPT: ${{ inputs.vm-setup-script }}
        FACTORY_CHEAP_MODEL: ${{ inputs.cheap-model }}
        FACTORY_STRONG_MODEL: ${{ inputs.strong-model }}
      run: ${{ runner.temp }}/a-factory
