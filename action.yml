name: factory
description: >
  Run a factory orchestrator subcommand. The action builds the factory package from
  its own checkout, so nothing is published to npm — the git ref on `uses:` is the
  only version. Input arrives via env vars (GITHUB_TOKEN, OPENCODE_API_KEY,
  ISSUE_NUMBER, FACTORY_* config), same contract as the CLI.

inputs:
  command:
    description: "Subcommand: triage | implement | review | epic | resume"
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    # hashFiles() can't reach $GITHUB_ACTION_PATH (workspace-only), and the moving
    # `v1` tag would serve stale caches — so key on a content hash of the source.
    - name: Compute build cache key
      id: key
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        hash=$(cat package.json tsconfig.build.json $(find src -type f | LC_ALL=C sort) | shasum -a 256 | cut -c1-16)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
    - name: Cache install + build
      id: cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ github.action_path }}/node_modules
          ${{ github.action_path }}/dist
        key: factory-build-${{ runner.os }}-${{ steps.key.outputs.hash }}
    - name: Build factory
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm install --no-audit --no-fund
        # npm's script-approval may skip postinstalls; opencode-ai's downloads the
        # `opencode` binary the SDK spawns, so run it explicitly. Idempotent.
        (cd node_modules/opencode-ai && node postinstall.mjs)
        npm run build
    - name: Run factory ${{ inputs.command }}
      shell: bash
      # node_modules/.bin on PATH so the SDK's `spawn opencode` resolves.
      run: |
        export PATH="$GITHUB_ACTION_PATH/node_modules/.bin:$PATH"
        node "$GITHUB_ACTION_PATH/dist/bin/factory.js" "${{ inputs.command }}"
