name: Epic
description: A large body of work to be decomposed into child tickets
title: "epic: "
labels: ["epic", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        An epic is decomposed by the orchestrator into child tickets, each of which flows through the normal implement → validate → review → gate path. Describe the whole, not the parts — the breakdown is the automation's job, though you can steer it below.

        Two settings at the bottom control the automation: **Automation intent** decides whether decomposition runs at all, and **Decomposition intent** decides whether it proposes the breakdown for you to approve or creates the child tickets straight away.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: The overall outcome this epic delivers.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: What this epic covers.
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Explicit non-goals. Keeps the decomposition from sprawling.
    validations:
      required: false

  - type: textarea
    id: suggested-breakdown
    attributes:
      label: Suggested breakdown (optional)
      description: If you already have sub-tasks in mind, list them. The orchestrator uses these as a starting point rather than inventing its own.
      value: |
        -
        -
    validations:
      required: false

  - type: dropdown
    id: automation-intent
    attributes:
      label: Automation intent
      description: Whether the orchestrator may decompose this epic. Decomposition itself is read-only — it writes no code.
      options:
        - "decompose this epic automatically"
        - "triage only — I'll trigger decomposition myself"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: decompose
    attributes:
      label: Decomposition intent
      description: What decomposition does with its result. Overrides the repo-wide FACTORY_DECOMPOSE_MODE default. With "propose", reply `approve` on the breakdown comment to create the tickets.
      options:
        - "propose child tickets, wait for human approval"
        - "auto-create child tickets immediately"
      default: 0
    validations:
      required: true
