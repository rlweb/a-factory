name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - name: dist is up to date
        run: |
          git diff --exit-code dist/ || {
            echo "::error::dist/ is stale — run 'pnpm run build' and commit the result."
            exit 1
          }
